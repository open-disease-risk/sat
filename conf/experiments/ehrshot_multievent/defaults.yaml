# @package _global_
defaults:
  - ../defaults

# EHRSHOT multi-event specific settings
dataset: ehrshot_multievent

# Number of competing events (2 admission + 7 discharge anchored)
num_events: 9

# Longer sequences for medical histories
max_seq_length: 512

# Maximum survival time (1 year for diagnosis tasks)
survival_max_time: 365

# Model hyperparameters optimized for medical sequences
learning_rate: 0.001
warmup_steps: 100
weight_decay: 0.01

# Transformer architecture for medical codes
transformer_hidden_size: 128
transformer_num_hidden_layers: 4
transformer_num_attention_heads: 8
transformer_intermediate_size: 512
transformer_attention_probs_dropout_prob: 0.1
transformer_hidden_probs_dropout: 0.1

# Shared layers for survival prediction
shared_intermediate_size: 256
shared_batch_norm: true
shared_hidden_dropout_prob: 0.1
shared_bias: true
shared_num_hidden_layers: 2
shared_num_labels: 32  # Discretized time bins

# Training settings
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
num_train_epochs: 50
gradient_accumulation_steps: 2

# Evaluation
eval_steps: 500
save_steps: 1000
logging_steps: 100
evaluation_strategy: steps

# Early stopping
early_stopping_patience: 10
load_best_model_at_end: true
metric_for_best_model: eval_concordance_index
greater_is_better: true