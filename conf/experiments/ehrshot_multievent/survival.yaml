# @package _global_
defaults:
  - defaults

# Task configuration for multi-event survival
tasks:
  _target_: sat.tasks.survival.SurvivalTask
  
  # Loss function for multi-event survival
  losses:
    _target_: sat.loss.nllpch.NLLPCHLoss
    num_events: ${num_events}
    
  # Additional metrics
  metrics:
    - concordance_index
    - integrated_brier_score
    - time_dependent_auc