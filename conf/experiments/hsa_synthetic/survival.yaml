# @package _global_
dataset: hsa_synthetic
modelname: survival

defaults:
  - hsa_synthetic/defaults
  - override /data/load: hsa_synthetic
  - override /data/parse: ${data/load}
  - override /data/transform: default
  - override /tokenizers: hsa_synthetic
  - override /transformers: numeric_bert
  - override /tasks: survival
  - override /trainer: hsa_synthetic/default


# Parameters tuned using /sweep/survival-multi-event.yaml
learning_rate: 0.0054623675902464594
token_emb: 2
sentence_emb: 3
transformer_hidden_size: 16
transformer_intermediate_size: 96
transformer_num_attention_heads: 4
transformer_num_hidden_layers: 1
weight_decay: 0.000017745775337070372
survival_intermediate_size: 24
survival_shared_intermediate_size: 16
survival_shared_num_hidden_layers: 1
