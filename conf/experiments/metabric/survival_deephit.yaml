# @package _global_
# Metabric experiment configuration with DeepHit loss function
dataset: metabric
modelname: survival_deephit

defaults:
  - metabric/defaults
  - override /data/load: metabric
  - override /data/parse: ${data/load}
  - override /tokenizers: ${data/load}
  - override /transformers: bert
  - override /tasks: survival
  - override /tasks/losses: deephit
  - override /trainer: ${data/load}/default
  
# Model architecture parameters
survival_intermediate_size: 8
survival_batch_norm: false
survival_hidden_dropout_prob: false
survival_bias: true
survival_num_hidden_layers: 1
survival_loss_weight: 1.0

# DeepHit-specific parameters
deephit_alpha: 0  # Weight for ranking component (0=only likelihood, 1=only ranking)
deephit_sigma: 0.1  # Temperature parameter for ranking component
