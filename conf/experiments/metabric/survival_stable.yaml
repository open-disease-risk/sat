# @package _global_
dataset: metabric
modelname: survival

defaults:
  - metabric/defaults
  - override /data/load: metabric
  - override /data/parse: ${data/load}
  - override /tokenizers: ${data/load}
  - override /transformers: bert
  - override /tasks: survival
  - override /trainer: ${data/load}/default
  - override /stability: metabric_ultimate

# Lower learning rate for stability
learning_rate: 0.00005

# Higher weight decay for regularization
weight_decay: 0.01  

# Lower number of epochs since learning rate is lower
warmup_steps: 20

survival_intermediate_size: 4
survival_batch_norm: false
survival_hidden_dropout_prob: 0.1
survival_bias: true
survival_num_hidden_layers: 1
survival_loss_weight: 1.0

# Add additional training parameters
trainer:
  max_grad_norm: 0.1  # Very aggressive gradient clipping