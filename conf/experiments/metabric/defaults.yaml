# @package _global_
defaults:
  - ../defaults

learning_rate: 0.001
warmup_steps: 80
weight_decay: 0.00001

select_hidden_layers: null

sentence_emb: 1
token_emb: 5
dropout: 0.05

transformer_hidden_size: 8
transformer_num_hidden_layers: 1
transformer_num_attention_heads: 2
transformer_intermediate_size: 8
transformer_attention_probs_dropout_prob: ${dropout}
transformer_hidden_probs_dropout: ${dropout}

shared_intermediate_size: 16
shared_batch_norm: true
shared_hidden_dropout_prob: ${dropout}
shared_bias: true
shared_num_hidden_layers: 0
shared_num_labels: 8

survival_shared_intermediate_size: 16
survival_shared_batch_norm: true
survival_shared_hidden_dropout_prob: ${dropout}
survival_shared_bias: true
survival_shared_num_hidden_layers: 0
survival_shared_num_labels: 8

survival_intermediate_size: 8
survival_batch_norm: false
survival_hidden_dropout_prob: ${dropout}
survival_bias: true
survival_num_hidden_layers: 1
survival_loss_weight: 1.0

survival_indiv_intermediate_size: 8
survival_indiv_num_hidden_layers: 1
survival_indiv_batch_norm: false
survival_indiv_hidden_dropout_prob: ${dropout}
survival_indiv_bias: true
