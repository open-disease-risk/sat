# @package _global_
defaults:
  - ../defaults
  - override /transformers: motor_t
  - override /tokenizers: ehrshot_motor
  - override /data/load: ehrshot_motor
  - override /data/parse: ehrshot_motor

# Dataset name
dataset: ehrshot_motor

# EHRSHOT multi-event settings
num_events: 7  # 7 discharge-anchored events

# MOTOR-T model dimensions
transformer_hidden_size: 768
transformer_num_hidden_layers: 12
transformer_num_attention_heads: 12
transformer_intermediate_size: 3072

# Maximum sequence length
max_seq_length: 496  # MOTOR-T context window

# Training hyperparameters for fine-tuning
learning_rate: 1e-5  # Lower LR for fine-tuning pretrained model
warmup_steps: 500
weight_decay: 0.01
dropout: 0.1

# Transformer settings
freeze_transformer: false  # Allow fine-tuning of MOTOR-T
select_hidden_layers: null  # Use all layers

# Token/sentence embedding strategies
token_emb: 2  # BERT-style (CLS token)
sentence_emb: 0  # CLS pooling

# Shared network between transformer and task heads
shared_intermediate_size: 256
shared_num_labels: 32  # Number of discretized time bins
shared_batch_norm: true
shared_hidden_dropout_prob: 0.1
shared_bias: true
shared_num_hidden_layers: 2

# Survival task settings
survival_max_time: 365  # Maximum follow-up (1 year)
survival_intermediate_size: 128
survival_num_hidden_layers: 2
survival_batch_norm: true
survival_hidden_dropout_prob: 0.1
survival_bias: true
survival_loss_weight: 1.0
survival_initializer: kaiming_uniform
survival_initializer_range: 0.02

# Classification task settings (event prediction)
classification_event_time_thr: 30  # 30 days threshold
classification_intermediate_size: 128
classification_num_hidden_layers: 2
classification_batch_norm: true
classification_hidden_dropout_prob: 0.1
classification_bias: true
classification_loss_weight: 0.5
classification_initializer: kaiming_uniform
classification_initializer_range: 0.02

# Regression task settings (time-to-event)
regression_num_labels: 1
regression_intermediate_size: 128
regression_num_hidden_layers: 2
regression_batch_norm: true
regression_hidden_dropout_prob: 0.1
regression_bias: true
regression_loss_weight: 0.5
regression_initializer: kaiming_uniform
regression_initializer_range: 0.02

# MTL initializers
mtl_initializer: kaiming_uniform
mtl_initializer_range: 0.02

# Training settings
per_device_train_batch_size: 16  # Adjust based on GPU memory
per_device_eval_batch_size: 32
num_train_epochs: 50
gradient_accumulation_steps: 2

# Evaluation settings
eval_steps: 500
save_steps: 1000
logging_steps: 100
evaluation_strategy: steps
save_total_limit: 3

# Early stopping
early_stopping_patience: 10
load_best_model_at_end: true
metric_for_best_model: eval_concordance_weighted_avg
greater_is_better: true

# Data source path
data_source: ${base_dir}/data/ehrshot_motor/sequences.parquet