# @package _global_

data_source: ${base_dir}/data/ehrshot_motor/sequences.parquet

data:
  preprocess_data: false  # Already preprocessed
  perform_split: true
  split_col: split  # Column containing train/valid/test
  duration_col: durations  # List of 7 event times
  event_col: events  # List of 7 event indicators
  id_col: patient_id
  num_events: 7  # 7 discharge-anchored events
  validation_ratio: 0.2  # Already split in preprocessing
  test_ratio: 0.2
  transformed_duration_cols:
    - t
    - f
  splits:
    - train
    - valid
    - test
  load:
    _target_: datasets.load_dataset
    path: json
    data_files:
      - ${modelhub}/${dataset}/${dataset}.json
    streaming: false