training_arguments:
  _target_: transformers.TrainingArguments
  report_to: "tensorboard"
  optim: adamw_torch
  overwrite_output_dir: True
  num_train_epochs: 200
  per_device_train_batch_size: 256
  per_device_eval_batch_size: 512
  load_best_model_at_end: True
  greater_is_better: ${tasks.eval_metric_greater_is_better}
  eval_strategy: "steps"
  eval_steps: 10
  logging_strategy: "steps"
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 10
  eval_delay: ${warmup_steps}
  weight_decay: 0.0001  # Very small weight decay
  metric_for_best_model: ${tasks.eval_metric}
  learning_rate: 5e-6  # Extremely small learning rate
  lr_scheduler_type: constant  # Constant LR for stability
  gradient_accumulation_steps: 4  # Accumulate gradients for more stability
  warmup_steps: ${warmup_steps}
  save_total_limit: 2
  output_dir: ${modelhub}/${dataset}/${modelname}
  save_safetensors: false
  gradient_checkpointing: false
  dataloader_pin_memory: true
  remove_unused_columns: false
  # Very aggressive gradient clipping
  max_grad_norm: 0.1
  adafactor: false
  fp16: false
