defaults:
  - metrics: default
  - losses: default

eval_metric: "eval_ipcw_avg"
eval_metric_greater_is_better: False

config:
  _target_: sat.models.tasks.heads.MTLConfig
  _convert_: "partial"
  freeze_transformer: false
  initializer_range: ${initializer_range}
  initializer: "kaiming_uniform"
  pretrained_params: ${transformers}
  sentence_emb: ${sentence_emb}
  token_emb: ${token_emb}
  hidden_size: ${transformer_hidden_size}
  num_features: ${tokenizers.max_seq_length}
  intermediate_size: ${shared_intermediate_size}
  num_labels: ${shared_num_labels}
  batch_norm: ${shared_batch_norm}
  hidden_dropout_prob: ${shared_hidden_dropout_prob}
  bias: ${shared_bias}
  num_hidden_layers: ${shared_num_hidden_layers}
  select_hidden_layers: ${select_hidden_layers}
  return_dict: true
  # Stability parameters
  grad_scale: ${stability.grad_scale}
  eps: ${stability.eps}
  max_norm: ${stability.max_norm}
  init_gain: ${stability.init_gain}
  weight_clamp_value: ${stability.weight_clamp_value}
  noise_scale: ${stability.noise_scale}
  nan_value: ${stability.nan_value}
  posinf_value: ${stability.posinf_value}
  neginf_value: ${stability.neginf_value}
  output_min: ${stability.output_min}
  output_max: ${stability.output_max}
  weight_init_std: ${stability.weight_init_std}
  softplus_beta: ${stability.softplus_beta}
  leaky_relu_negative_slope: ${stability.leaky_relu_negative_slope}
  use_residual: ${stability.use_residual}
  layer_norm_eps: ${stability.layer_norm_eps}
  task_heads:
    - _target_: sat.models.tasks.heads.SurvivalConfig
      _recursive_: false
      num_features: ${shared_num_labels}
      intermediate_size: ${survival_intermediate_size}
      num_labels: ${data.label_transform.cuts}
      batch_norm: ${survival_batch_norm}
      hidden_dropout_prob: ${survival_hidden_dropout_prob}
      indiv_intermediate_size: ${survival_intermediate_size}
      indiv_num_hidden_layers: ${survival_num_hidden_layers}
      bias: ${survival_bias}
      num_hidden_layers: ${survival_num_hidden_layers}
      loss_weight: ${survival_loss_weight}
      loss: ${tasks.losses}
      num_events: ${data.num_events}
      # Stability parameters
      grad_scale: ${stability.grad_scale}
      eps: ${stability.eps}
      max_norm: ${stability.max_norm}
      init_gain: ${stability.init_gain}
      weight_clamp_value: ${stability.weight_clamp_value}
      noise_scale: ${stability.noise_scale}
      nan_value: ${stability.nan_value}
      posinf_value: ${stability.posinf_value}
      neginf_value: ${stability.neginf_value}
      output_min: ${stability.output_min}
      output_max: ${stability.output_max}
      weight_init_std: ${stability.weight_init_std}
      softplus_beta: ${stability.softplus_beta}
      leaky_relu_negative_slope: ${stability.leaky_relu_negative_slope}
      use_residual: ${stability.use_residual}
      layer_norm_eps: ${stability.layer_norm_eps}

    - _target_: sat.models.tasks.heads.EventClassificationTaskConfig
      _recursive_: false
      num_features: ${shared_num_labels}
      intermediate_size: ${classification_intermediate_size}
      num_labels: 1
      batch_norm: ${classification_batch_norm}
      hidden_dropout_prob: ${classification_hidden_dropout_prob}
      bias: ${classification_bias}
      indiv_intermediate_size: ${classification_intermediate_size}
      indiv_num_hidden_layers: ${classification_num_hidden_layers}
      num_hidden_layers: ${classification_num_hidden_layers}
      event_time_thr: ${classification_event_time_thr}
      loss: ${tasks.losses}
      loss_weight: ${classification_loss_weight}
      # Stability parameters
      grad_scale: ${stability.grad_scale}
      eps: ${stability.eps}
      max_norm: ${stability.max_norm}
      init_gain: ${stability.init_gain}
      weight_clamp_value: ${stability.weight_clamp_value}
      noise_scale: ${stability.noise_scale}
      nan_value: ${stability.nan_value}
      posinf_value: ${stability.posinf_value}
      neginf_value: ${stability.neginf_value}
      output_min: ${stability.output_min}
      output_max: ${stability.output_max}
      weight_init_std: ${stability.weight_init_std}
      softplus_beta: ${stability.softplus_beta}
      leaky_relu_negative_slope: ${stability.leaky_relu_negative_slope}
      use_residual: ${stability.use_residual}
      layer_norm_eps: ${stability.layer_norm_eps}

    - _target_: sat.models.tasks.heads.EventDurationTaskConfig
      _recursive_: false
      num_features: ${shared_num_labels}
      intermediate_size: ${regression_intermediate_size}
      num_labels: ${regression_num_labels}
      batch_norm: ${regression_batch_norm}
      hidden_dropout_prob: ${regression_hidden_dropout_prob}
      indiv_intermediate_size: ${regression_intermediate_size}
      indiv_num_hidden_layers: ${regression_num_hidden_layers}
      bias: ${regression_bias}
      num_hidden_layers: ${regression_num_hidden_layers}
      loss: ${tasks.losses}
      loss_weight: ${regression_loss_weight}
      # Stability parameters
      grad_scale: ${stability.grad_scale}
      eps: ${stability.eps}
      max_norm: ${stability.max_norm}
      init_gain: ${stability.init_gain}
      weight_clamp_value: ${stability.weight_clamp_value}
      noise_scale: ${stability.noise_scale}
      nan_value: ${stability.nan_value}
      posinf_value: ${stability.posinf_value}
      neginf_value: ${stability.neginf_value}
      output_min: ${stability.output_min}
      output_max: ${stability.output_max}
      weight_init_std: ${stability.weight_init_std}
      softplus_beta: ${stability.softplus_beta}
      leaky_relu_negative_slope: ${stability.leaky_relu_negative_slope}
      use_residual: ${stability.use_residual}
      layer_norm_eps: ${stability.layer_norm_eps}
