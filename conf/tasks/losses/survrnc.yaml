# Configuration for SurvRNC loss function
# SurvRNC: Learning Ordered Representations for Survival Prediction using Rank-N-Contrast

# Standalone SurvRNC loss configuration
sat-transformer:
  _target_: sat.loss.SurvRNCLoss
  temperature: ${survrnc_temperature}  # Controls sensitivity to differences (lower = more sensitive)
  margin: ${survrnc_margin}  # Margin for ranking loss between positive and negative pairs
  batch_samples: ${survrnc_batch_samples}  # Number of anchor samples to use (for efficiency)
  importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
  num_events: ${data.num_events}
  balance_strategy: ${balance_strategy}
  ema_momentum: ${ema_momentum}

