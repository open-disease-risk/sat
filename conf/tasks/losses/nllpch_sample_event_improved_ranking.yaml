sat-transformer:
  _target_: sat.loss.MetaLoss
  losses:
    - _target_: sat.loss.SATNLLPCHazardLoss
      importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
      num_events: ${data.num_events}
    - _target_: sat.loss.ListMLELoss
      temperature: 0.5  # Very high temperature for extremely smooth gradients
      lambda_inter: 0.1  # Minimal lambda for more stable training
      lambda_intra: 0.1  # Minimal lambda for more stable training
      eps: 1e-5  # Much larger epsilon for better numerical stability
      importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
      num_events: ${data.num_events}
  coeffs:
    - 1.0
    - 0.0  # Temporarily disable the ListMLE loss for initial training stability
