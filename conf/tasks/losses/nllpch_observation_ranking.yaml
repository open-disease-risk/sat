# @package _group_
_target_: sat.loss.MetaLoss
losses:
  - _target_: sat.loss.SATNLLPCHazardLoss
    num_events: ${tasks.num_events}
    balance_strategy: fixed
    balance_params:
      coeffs: [1.0]
  - _target_: sat.loss.ObservationEventRankingLoss
    duration_cuts: ${paths.duration_cuts}
    importance_sample_weights: ${paths.importance_sample_weights}
    sigma: 0.1
    num_events: ${tasks.num_events}
    balance_strategy: fixed
    balance_params:
      coeffs: [0.2]  # Smaller weight for ranking component
balance_strategy: uncertainty
balance_params:
  log_dir: ${outputs.model_dir}
  log_interval: 10