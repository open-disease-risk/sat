sat-transformer:
  _target_: sat.loss.DeepHitLoss
  alpha: ${deephit_alpha}  # Weight for ranking component (0 = only likelihood, 1 = only ranking)
  sigma: ${deephit_sigma}  # Temperature parameter for ranking
  discrete_bins: ${data.label_transform.save_dir}/duration_cuts.csv
  importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
  num_events: ${data.num_events}
  balance_strategy: ${balance_strategy}
  ema_momentum: ${ema_momentum}
