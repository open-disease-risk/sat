sat-transformer:
  _target_: sat.loss.ListMLERankingLoss
  temperature: ${listmle_temperature}  # Temperature controlling smoothness of gradients
  lambda_inter: ${listmle_lambda_inter}  # Weight for inter-subject ranking component
  lambda_intra: ${listmle_lambda_intra}  # Weight for intra-subject ranking component
  eps: ${listmle_eps}  # Epsilon for numerical stability
  importance_sample_weights: ${data.label_transform.save_dir}/imp_sample.csv
  num_events: ${data.num_events}
  balance_strategy: ${balance_strategy}
  ema_momentum: ${ema_momentum}
