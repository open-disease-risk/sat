# @package _global_

# Default stability parameters (fairly relaxed)
stability:
  grad_scale: 0.3
  eps: 1e-06
  max_norm: 0.3
  init_gain: 0.05
  weight_clamp_value: 0.05
  noise_scale: 1e-05
  nan_value: 0.0
  posinf_value: 1.0
  neginf_value: -1.0
  output_min: -15.0
  output_max: 15.0
  weight_init_std: 0.02
  softplus_beta: 0.8
  leaky_relu_negative_slope: 0.01
  use_residual: True
  layer_norm_eps: 1e-08
