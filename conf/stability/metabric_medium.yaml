# @package _global_

# Medium stability parameters for metabric dataset
stability:
  grad_scale: 0.1
  eps: 1e-05
  max_norm: 0.2
  init_gain: 0.01
  weight_clamp_value: 0.02
  noise_scale: 5e-05
  nan_value: 0.0
  posinf_value: 0.5
  neginf_value: -0.5
  output_min: -8.0
  output_max: 8.0
  weight_init_std: 0.01
  softplus_beta: 0.5
  leaky_relu_negative_slope: 0.005
  use_residual: True
  layer_norm_eps: 1e-06
