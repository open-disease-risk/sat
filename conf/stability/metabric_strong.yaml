# @package _global_

# Strong stability parameters for metabric dataset
stability:
  grad_scale: 0.001
  eps: 0.01
  max_norm: 0.01
  init_gain: 0.0001
  weight_clamp_value: 0.001
  noise_scale: 0.001
  nan_value: 0.0
  posinf_value: 0.01
  neginf_value: -0.01
  output_min: -1.0
  output_max: 1.0
  weight_init_std: 0.0001
  softplus_beta: 0.01
  leaky_relu_negative_slope: 0.0001
  use_residual: False
  layer_norm_eps: 0.01
